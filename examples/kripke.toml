# kripke.toml — an intensional model with worlds w0 (actual), w1, w2 for intensional.lex.
# acc(w, v): v is accessible from w;  dox(x, w, v): v is compatible with x's beliefs in w;
# bou(x, w, v): v is compatible with x's goals in w.
[domains]
e = ["john", "mary", "ann", "bo", "s1"]
s = ["w0", "w1", "w2"]
world = "w0"

[interpretation]
student = [["w0", "ann"], ["w0", "bo"], ["w1", "ann"], ["w1", "bo"], ["w2", "ann"], ["w2", "bo"]]
spy = [["w0", "s1"], ["w1", "bo"], ["w2", "bo"]]
unicorn = [["w1", "s1"]]
leave = [["w0", "mary"], ["w1", "mary"], ["w1", "bo"], ["w1", "ann"], ["w2", "mary"], ["w2", "bo"]]
acc = [["w0", "w1"], ["w0", "w2"]]
dox = [["john", "w0", "w1"], ["john", "w0", "w2"]]
bou = [["john", "w0", "w1"]]
find = [["w1", "john", "s1"]]
